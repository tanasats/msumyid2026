# site ของ MSU Digital ID บน nginx ของ host — /etc/nginx/sites-available/msumyid.conf
# ต้องติดตั้ง /etc/nginx/snippets/cloudflare-realip.conf ก่อน (scripts/update-cloudflare-realip.sh)
# port ของ upstream ต้องตรงกับ WEB_PORT / API_PORT ใน /opt/msumyid/.env

upstream msumyid_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream msumyid_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name did.msu.ac.th;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    # ใช้ "listen ... http2" แทน "http2 on;" (มีตั้งแต่ nginx 1.25.1) เพราะ Ubuntu 24.04 มาพร้อม nginx 1.24
    # nginx ≥ 1.25.1 แค่เตือนว่า deprecated แต่ยังทำงาน
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name did.msu.ac.th;
    # ไม่เปิดเผยเลขรุ่นของ nginx ใน header Server และหน้า error
    server_tokens off;

    # ใบรับรองของมหาวิทยาลัย (*.msu.ac.th) — fullchain ต้องรวม intermediate
    ssl_certificate     /etc/ssl/msu/fullchain.pem;
    ssl_certificate_key /etc/ssl/msu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # IP จริงของผู้ใช้จาก Cloudflare (rate limit ของการ login ต้องใช้)
    include /etc/nginx/snippets/cloudflare-realip.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API รับ JSON เป็นหลัก — ยกเว้น /api/verify/pdf (ด้านล่าง) ที่รับไฟล์ PDF
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # ออกใบรับรอง (สร้าง RSA 4096) ใช้เวลาหลายวินาที — มากกว่า SIGNER_TIMEOUT_MS
    proxy_read_timeout 60s;

    # API: ตัด /api ออก (/api/auth/me → /auth/me) — Express รู้จักแค่ path เดิม
    location /api/ {
        proxy_pass http://msumyid_api/;
        # ข้อมูลส่วนตัว / ไฟล์ .p12 — ห้าม cache ที่ Cloudflare หรือ browser
        add_header Cache-Control "no-store" always;
    }

    # ตรวจลายมือชื่อบนเอกสาร (สาธารณะ) — รับ PDF ไม่เกิน 20 MB ต้องตรงกับ MAX_PDF_BYTES ใน apps/api/src/routes/verify.ts
    location = /api/verify/pdf {
        client_max_body_size 20m;
        proxy_pass http://msumyid_api/verify/pdf;
        add_header Cache-Control "no-store" always;
    }

    # ไฟล์ของการลงนามเอกสาร (Garage S3) — browser อัปโหลด/ดาวน์โหลดตรงด้วย presigned URL แบบ path style
    # https://did.msu.ac.th/<S3_BUCKET>/<key> → Garage (127.0.0.1:GARAGE_S3_PORT) โดยคง path และ Host เดิม
    # (ลายเซ็นของ presigned URL ผูกกับ Host และ path — ห้ามตัด/เปลี่ยน) Garage ตรวจสิทธิ์จากลายเซ็นของ URL เอง
    # ชื่อ location ต้องตรงกับ S3_BUCKET ใน env/api.env / port ต้องตรงกับ GARAGE_S3_PORT ใน .env
    location /msumyid-files/ {
        # ZIP ไม่เกิน 500 MB (docs/design/document-signing.md) — Cloudflare อาจจำกัดขนาด request ต่ำกว่านี้ตามแผนที่ใช้
        client_max_body_size 520m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:3900;
        add_header Cache-Control "no-store" always;
    }

    # CRL สาธารณะ (cdp.msu.ac.th ใช้ cron ดึง) — API ตั้ง Cache-Control/Last-Modified เอง
    location = /api/crl/msu-ca.crl {
        proxy_pass http://msumyid_api/crl/msu-ca.crl;
    }

    location / {
        proxy_pass http://msumyid_web;
    }
}
