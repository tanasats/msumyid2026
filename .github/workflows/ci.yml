# ทุก PR: lint + typecheck + test กับ PostgreSQL จริง และ OpenSSL จริง (signer)
# Release เรียกใช้ซ้ำผ่าน workflow_call ก่อน build image
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          # ฐานของ test ต้องลงท้ายด้วย _test (tests/global-setup.ts ตรวจ)
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # ค่าที่ test ของ API ไม่ได้กำหนดใน vitest.config.ts (ที่เหลือ test กำหนดเองแล้ว)
      PORT: "4010"
      WEB_URL: http://localhost:3010
      CORS_ORIGIN: http://localhost:3010
      DATABASE_URL: postgres://app:app@localhost:5432/app_test
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      SESSION_COOKIE_NAME: msumyid_session
    steps:
      - uses: actions/checkout@v4
      # เวอร์ชัน pnpm อ่านจาก packageManager ใน package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: openssl version
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
