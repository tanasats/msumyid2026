# merge เข้า main: CI ซ้ำ → build + push image api/web/signer ไป GHCR แท็ก sha-<commit 7 ตัว>
# deploy เองบน VM: ./scripts/deploy.sh sha-xxxxxxx (docs/deployment.md)
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [api, web, signer]
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          # ใช้เฉพาะ web (ฝังลงโค้ดฝั่ง browser) — เปลี่ยนได้ที่ Settings → Variables → NEXT_PUBLIC_API_URL
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://did.msu.ac.th/api' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  summary:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - run: |
          TAG="sha-${GITHUB_SHA::7}"
          {
            echo "### พร้อม deploy: \`$TAG\`"
            echo
            echo '```'
            echo "cd /opt/msumyid && ./scripts/deploy.sh $TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
